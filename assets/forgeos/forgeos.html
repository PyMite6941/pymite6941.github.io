<!doctype html>
<html>
	<head>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js"></script>
		<style
			type="text/css"
			rel="stylesheet"
			src="./style.css"></style>

		<title>WebOS - Matt Gresham</title>
		<script>
			(function showWindow({ elementName }) {
				element = document.getElementById(elementName);
				if (element.style.visibility === 'hidden') {
					element.style.visibility === 'show';
				}
			});
			(function hideWindow({ elementName }) {
				element = document.getElementById(elementName);
				if (element.style.visibility === 'show') {
					element.style.visibility === 'hidden';
				}
			});
		</script>
	</head>
	<body>
		<div class="desktop">
			<div class="desktop-taskbar">
				<img
					src="photos/termainl-icon.png"
					alt="terminal"
					onclick="showWindow('terminal')" />
				<img
					src="photos/web-browser-icon.png"
					alt="web browser"
					onclick="showWindow('web browser')" />
				<img
					src="photos/chess-icon.png"
					alt="chess" />
			</div>
			<div class="desktop-grid">
				<div class="icon">
					<img
						src="photos/files-icon.png"
						alt="files" />
					<span>Files</span>
				</div>
				<div class="icon">
					<img
						src="photos/terminal-icon.png"
						alt="terminal" />
					<span>Terminal</span>
				</div>
			</div>
			<div
				class="window"
				id="terminal"
				style="top: 100px; left: 100px">
				<div class="window-header">
					<span class="title">Terminal - User</span>
					<div class="controls">
						<button class="minimize">-</button>
						<button class="close">x</button>
					</div>
				</div>
				<div class="window-body"></div>
			</div>
			<div
				class="window"
				id="web search"
				style="top: 100px; left: 100px">
				<div class="window-header">
					<span class="title">Magellan Search</span>
					<div class="controls">
						<button class="minimize">-</button>
						<button class="close">x</button>
					</div>
				</div>
				<div class="window-body">
					<iframe
						src="magellan-search-engine.vercel.app"
						frameborder="0"></iframe>
				</div>
			</div>
			<div
				class="window"
				id="chess"
				style="top: 100px; left: 100px"
				><div class="window-header">
					<span class="title">Chess</span>
					<div class="controls">
						<button class="minimize">-</button>
						<button class="close">x</button>
					</div>
				</div>
				<div class="window-body">
					<iframe
						src="play-chess-nine.vercel.app"
						frameborder="0"></iframe>
				</div>
			</div>
		</div>
	</body>
</html>
