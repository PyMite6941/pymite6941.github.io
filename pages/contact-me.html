<!doctype html>
<html lang="en" data-depth="1">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
		<meta
			name="description"
			content="Contact Matt Gresham — send a message directly from the portfolio." />
		<link rel="stylesheet" type="text/css" href="../index.css" />
		<script src="../assets/js/site-style.js" defer></script>
		<title>Matt G | Contact</title>
		<style>
			.contact-wrapper {
				max-width: 560px;
				margin: 48px auto;
				padding: 0 24px;
			}
			.contact-card {
				background: var(--card-bg);
				border: 1px solid var(--border-color);
				border-radius: 12px;
				padding: 36px 40px;
			}
			.contact-card h2 {
				margin: 0 0 6px 0;
				font-size: 20px;
				color: var(--text-color);
			}
			.contact-card .subtitle {
				color: #8b949e;
				font-size: 14px;
				margin: 0 0 28px 0;
				line-height: 1.5;
			}
			.form-group {
				display: flex;
				flex-direction: column;
				gap: 5px;
				margin-bottom: 20px;
			}
			.form-group label {
				font-size: 13px;
				font-weight: 600;
				color: var(--text-color);
				letter-spacing: 0.3px;
			}
			.form-group input,
			.form-group textarea {
				background: #0d1117;
				border: 1px solid var(--border-color);
				border-radius: 8px;
				color: var(--text-color);
				font-size: 14px;
				font-family: inherit;
				padding: 10px 14px;
				outline: none;
				transition: border-color 0.15s;
				width: 100%;
				box-sizing: border-box;
			}
			.form-group input:focus,
			.form-group textarea:focus {
				border-color: var(--button-color);
			}
			.form-group textarea {
				resize: vertical;
				min-height: 130px;
			}
			.form-group input::placeholder,
			.form-group textarea::placeholder {
				color: #484f58;
			}
			.submit-btn {
				width: 100%;
				background: var(--button-color);
				color: #fff;
				border: none;
				border-radius: 8px;
				padding: 12px;
				font-size: 15px;
				font-weight: 600;
				font-family: inherit;
				cursor: pointer;
				transition: opacity 0.15s;
				margin-top: 4px;
			}
			.submit-btn:hover {
				opacity: 0.85;
			}
			.contact-alt {
				text-align: center;
				margin-top: 20px;
				font-size: 13px;
				color: #8b949e;
			}
			.contact-alt a {
				color: var(--link-color);
				text-decoration: none;
			}
			.contact-alt a:hover {
				text-decoration: underline;
			}
			.fs-success {
				display: none;
				background: #0f3a1f;
				border: 1px solid #3fb95060;
				color: #3fb950;
				border-radius: 8px;
				padding: 14px 18px;
				font-size: 14px;
				margin-bottom: 20px;
				text-align: center;
			}
			.fs-field-error {
				color: #f85149;
				font-size: 12px;
				margin-top: 3px;
			}
			@media (max-width: 480px) {
				.contact-card {
					padding: 24px 20px;
				}
			}
		</style>
	</head>
	<body>
		<div id="site-nav"></div>
		<header class="hero-section">
			<h1>Matt G</h1>
			<h3>Contact Me</h3>
			<p style="color: #8b949e; max-width: 480px; margin: 8px auto 0; font-size: 15px">
				Got a project, question, or just want to say hi — I read everything
			</p>
		</header>
		<main>
			<div class="contact-wrapper">
				<div class="contact-card">
					<h2>Send a message</h2>
					<div class="fs-success" data-fs-success>
						&#10003; Message sent — I'll be in touch soon.
					</div>
					<form id="contact-form">
						<div class="form-group">
							<label for="name">Name</label>
							<input type="text" id="name" name="name" placeholder="Your name" data-fs-field required />
							<span class="fs-field-error" data-fs-error="name"></span>
						</div>
						<div class="form-group">
							<label for="email">Email</label>
							<input type="email" id="email" name="email" placeholder="you@example.com" data-fs-field required />
							<span class="fs-field-error" data-fs-error="email"></span>
						</div>
						<div class="form-group">
							<label for="message">Message</label>
							<textarea id="message" name="message" placeholder="What's on your mind?" data-fs-field required></textarea>
							<span class="fs-field-error" data-fs-error="message"></span>
						</div>
						<button type="submit" class="submit-btn" data-fs-submit-btn>Send Message</button>
					</form>
				</div>
				<p class="contact-alt">
					Or email directly at <a href="mailto:greshamd27@gmail.com">greshamd27@gmail.com</a>
				</p>
			</div>
		</main>
		<div id="site-footer"></div>
		<script>
			window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
			formspree('initForm', { formElement: '#contact-form', formId: 'xqegrqdb' });
		</script>
		<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
	</body>
</html>
