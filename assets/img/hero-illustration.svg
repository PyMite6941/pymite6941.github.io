<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2127;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8957e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background grid pattern -->
  <rect width="400" height="200" fill="url(#bgGrad)"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#30363d" stroke-width="0.5"/>
  </pattern>
  <rect width="400" height="200" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Left: Terminal/Code window representing offline-first development -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="140" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="28" rx="8" fill="#21262d"/>
    <circle cx="12" cy="14" r="6" fill="#f85149" opacity="0.8"/>
    <circle cx="30" cy="14" r="6" fill="#d29922" opacity="0.8"/>
    <circle cx="48" cy="14" r="6" fill="#3fb950" opacity="0.8"/>
    
    <!-- Code lines -->
    <text x="16" y="48" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8b949e">tinyGPT.train()</text>
    <text x="16" y="66" font-family="'JetBrains Mono',monospace" font-size="11" fill="#58a6ff">model.forward(x)</text>
    <text x="16" y="84" font-family="'JetBrains Mono',monospace" font-size="11" fill="#3fb950">loss.backward()</text>
    <text x="16" y="102" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8957e5">optimizer.step()</text>
    <text x="16" y="120" font-family="'JetBrains Mono',monospace" font-size="11" fill="#a371f7"># CPU only ✓</text>
    <text x="16" y="138" font-family="'JetBrains Mono',monospace" font-size="11" fill="#a371f7"># offline ✓</text>
  </g>
  
  <!-- Center: Shield with AI brain - security + AI -->
  <g transform="translate(185, 25)">
    <g filter="url(#glow)">
      <!-- Shield shape -->
      <path d="M15,0 C25,0 30,5 30,15 C30,25 15,50 15,50 C15,50 0,25 0,15 C0,5 5,0 15,0 Z" fill="#161b22" stroke="url(#purpleGrad)" stroke-width="2"/>
      <!-- Neural network nodes -->
      <circle cx="15" cy="18" r="3" fill="#8957e5"/>
      <circle cx="8" cy="30" r="2.5" fill="#58a6ff"/>
      <circle cx="22" cy="30" r="2.5" fill="#8957e5"/>
      <circle cx="15" cy="40" r="2" fill="#58a6ff"/>
      <!-- Connections -->
      <line x1="15" y1="21" x2="8" y2="27.5" stroke="#8957e5" stroke-width="1.5" opacity="0.6"/>
      <line x1="15" y1="21" x2="22" y2="27.5" stroke="#8957e5" stroke-width="1.5" opacity="0.6"/>
      <line x1="8" y1="32.5" x2="15" y2="38" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
      <line x1="22" y1="32.5" x2="15" y2="38" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
    </g>
    <text x="15" y="75" text-anchor="middle" font-family="'Google Sans',sans-serif" font-size="11" fill="#8b949e" font-weight="600">LLM Protector</text>
    <text x="15" y="88" text-anchor="middle" font-family="'Google Sans',sans-serif" font-size="9" fill="#3fb950" font-weight="700">50 attacks • 11 categories</text>
  </g>
  
  <!-- Right: Raspberry Pi / Cyberdeck representing hardware -->
  <g transform="translate(320, 40)">
    <!-- Pi board -->
    <rect x="0" y="0" width="50" height="35" rx="3" fill="#1a3a2a" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="3" y="3" width="14" height="14" rx="2" fill="#0d1117" stroke="#30363d"/>
    <rect x="20" y="3" width="27" height="14" rx="2" fill="#0d1117" stroke="#30363d"/>
    <rect x="3" y="20" width="20" height="12" rx="2" fill="#0d1117" stroke="#30363d"/>
    <rect x="26" y="20" width="21" height="12" rx="2" fill="#0d1117" stroke="#30363d"/>
    
    <!-- GPIO pins -->
    <g stroke="#3fb950" stroke-width="0.8">
      <line x1="48" y1="4" x2="52" y2="4"/>
      <line x1="48" y1="10" x2="52" y2="10"/>
      <line x1="48" y1="16" x2="52" y2="16"/>
      <line x1="48" y1="22" x2="52" y2="22"/>
      <line x1="48" y1="28" x2="52" y2="28"/>
    </g>
    
    <text x="25" y="60" text-anchor="middle" font-family="'Google Sans',sans-serif" font-size="10" fill="#8b949e" font-weight="600">Cyberdeck</text>
    <text x="25" y="72" text-anchor="middle" font-family="'Google Sans',sans-serif" font-size="8" fill="#58a6ff">Pi 5 • Mechanical KB • Trackball</text>
  </g>
  
  <!-- Bottom: Search/Finance icons representing full-stack -->
  <g transform="translate(60, 175)">
    <!-- Magnifying glass (Magellan) -->
    <circle cx="15" cy="15" r="10" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <line x1="21" y1="21" x2="28" y2="28" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    <text x="15" y="40" text-anchor="middle" font-family="'Google Sans',sans-serif" font-size="9" fill="#8b949e">Magellan</text>
  </g>
  
  <g transform="translate(160, 175)">
    <!-- Dollar/chart (Finance) -->
    <path d="M15,5 L15,25 M8,10 L22,10 M8,20 L22,20" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
    <path d="M15,5 C15,5 10,10 15,15 C15,15 20,20 15,25" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/>
    <text x="15" y="40" text-anchor="middle" font-family="'Google Sans',sans-serif" font-size="9" fill="#8b949e">Finance Kit</text>
  </g>
  
  <g transform="translate(260, 175)">
    <!-- Network/globe (Client work) -->
    <circle cx="15" cy="15" r="10" fill="none" stroke="#8957e5" stroke-width="2"/>
    <line x1="15" y1="5" x2="15" y2="25" stroke="#8957e5" stroke-width="1.5"/>
    <line x1="5" y1="15" x2="25" y2="15" stroke="#8957e5" stroke-width="1.5"/>
    <line x1="8" y1="8" x2="22" y2="22" stroke="#8957e5" stroke-width="1"/>
    <line x1="22" y1="8" x2="8" y2="22" stroke="#8957e5" stroke-width="1"/>
    <text x="15" y="40" text-anchor="middle" font-family="'Google Sans',sans-serif" font-size="9" fill="#8b949e">Client Work</text>
  </g>
</svg>